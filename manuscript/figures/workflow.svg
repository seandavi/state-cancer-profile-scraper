<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/>
    </marker>
  </defs>
  <style>
    .box   { fill: #f5f5f4; stroke: #8a8a88; stroke-width: 1.2; }
    .accent{ fill: #e8f0f7; stroke: #0072B2; stroke-width: 1.4; }
    .title { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
    .body  { font-size: 11px; fill: #333333; }
    .lab   { font-size: 10.5px; fill: #555555; font-style: italic; }
    .flow  { stroke: #555555; stroke-width: 1.4; fill: none; }
  </style>

  <!-- Row 1: capture -->
  <rect class="box" x="10" y="20" width="180" height="92" rx="6"/>
  <text x="100" y="40" text-anchor="middle" class="title">State Cancer Profiles</text>
  <text x="100" y="58" text-anchor="middle" class="body">4 query-driven report endpoints</text>
  <text x="100" y="74" text-anchor="middle" class="body">no API &#183; no bulk download</text>
  <text x="100" y="90" text-anchor="middle" class="body">no archive of prior estimates</text>

  <line class="flow" x1="190" y1="66" x2="250" y2="66" marker-end="url(#arrow)"/>
  <text x="220" y="36" text-anchor="middle" class="lab">one request</text>
  <text x="220" y="48" text-anchor="middle" class="lab">per stratum</text>

  <rect class="box" x="252" y="20" width="180" height="92" rx="6"/>
  <text x="342" y="40" text-anchor="middle" class="title">Enumerate &amp; fetch</text>
  <text x="342" y="58" text-anchor="middle" class="body">vocabulary read from live pages</text>
  <text x="342" y="74" text-anchor="middle" class="body">catalog of known-good strata</text>
  <text x="342" y="90" text-anchor="middle" class="body">retry, backoff, bounded workers</text>

  <line class="flow" x1="432" y1="66" x2="492" y2="66" marker-end="url(#arrow)"/>

  <rect class="box" x="494" y="20" width="180" height="92" rx="6"/>
  <text x="584" y="40" text-anchor="middle" class="title">Parse &amp; decode</text>
  <text x="584" y="58" text-anchor="middle" class="body">data block located by content</text>
  <text x="584" y="74" text-anchor="middle" class="body">suppressed cells &#8594; typed nulls</text>
  <text x="584" y="90" text-anchor="middle" class="body">+ suppression_reason</text>

  <line class="flow" x1="674" y1="66" x2="734" y2="66" marker-end="url(#arrow)"/>

  <rect class="box" x="736" y="20" width="114" height="92" rx="6"/>
  <text x="793" y="40" text-anchor="middle" class="title">Typed extract</text>
  <text x="793" y="58" text-anchor="middle" class="body">4 topics</text>
  <text x="793" y="74" text-anchor="middle" class="body">CSV.gz + Parquet</text>
  <text x="793" y="90" text-anchor="middle" class="body">strata as columns</text>

  <!-- Row 1 to Row 2 -->
  <line class="flow" x1="793" y1="112" x2="793" y2="150" marker-end="url(#arrow)"/>
  <text x="785" y="135" text-anchor="end" class="lab">monthly, automated</text>

  <!-- Row 2: publication (right to left) -->
  <rect class="box" x="736" y="152" width="114" height="92" rx="6"/>
  <text x="793" y="172" text-anchor="middle" class="title">GitHub release</text>
  <text x="793" y="190" text-anchor="middle" class="body">dated, immutable</text>
  <text x="793" y="206" text-anchor="middle" class="body">sha256 manifest</text>
  <text x="793" y="222" text-anchor="middle" class="body">notes files</text>

  <line class="flow" x1="736" y1="198" x2="676" y2="198" marker-end="url(#arrow)"/>
  <text x="706" y="256" text-anchor="middle" class="lab"> </text>

  <rect class="box" x="494" y="152" width="180" height="92" rx="6"/>
  <text x="584" y="172" text-anchor="middle" class="title">Vintage identification</text>
  <text x="584" y="190" text-anchor="middle" class="body">content hash, timestamp dropped</text>
  <text x="584" y="206" text-anchor="middle" class="body">same hash &#8658; same vintage</text>
  <text x="584" y="222" text-anchor="middle" class="body">catalog regression check</text>

  <line class="flow" x1="494" y1="198" x2="434" y2="198" marker-end="url(#arrow)"/>
  <text x="464" y="168" text-anchor="middle" class="lab">new vintage</text>
  <text x="464" y="180" text-anchor="middle" class="lab">only</text>

  <rect class="accent" x="252" y="152" width="180" height="92" rx="6"/>
  <text x="342" y="172" text-anchor="middle" class="title">Zenodo deposit</text>
  <text x="342" y="190" text-anchor="middle" class="body">one version DOI per vintage</text>
  <text x="342" y="206" text-anchor="middle" class="body">best capture, first-capture date</text>
  <text x="342" y="222" text-anchor="middle" class="body">concept 10.5281/zenodo.11098814</text>

  <!-- Upstream revision cycle -->
  <line class="flow" x1="60" y1="112" x2="60" y2="150" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line class="flow" x1="140" y1="152" x2="140" y2="114" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <rect class="box" x="10" y="152" width="180" height="92" rx="6"/>
  <text x="100" y="172" text-anchor="middle" class="title">Upstream revision</text>
  <text x="100" y="190" text-anchor="middle" class="body">new SEER/NPCR submission,</text>
  <text x="100" y="206" text-anchor="middle" class="body">shifted 5-year window, revised</text>
  <text x="100" y="222" text-anchor="middle" class="body">denominators; site overwritten</text>
  <text x="100" y="266" text-anchor="middle" class="lab">~98% of values change per vintage;</text>
  <text x="100" y="280" text-anchor="middle" class="lab">prior values unrecoverable upstream</text>
</svg>
