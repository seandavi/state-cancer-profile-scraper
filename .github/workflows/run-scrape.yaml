name: Create data release

on:
  schedule:
    - cron: '0 0 1 * *' # Runs at 00:00 UTC on the 1st day of every month

  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: 'Force full-cartesian re-discovery (ignore existing catalog)'
        type: boolean
        default: false
  # run on a tag with a push only
  push:
    tags:
      - "*"
jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Fetch previous release's catalog (if any)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Pull the latest release's catalog so this run can skip combinations
        # that returned no data last time. First release (or missing artifact)
        # falls through silently and the scrape runs in discovery mode.
        gh release download --pattern 'scrape_catalog.jsonl' \
          --repo ${{ github.repository }} \
          || echo "No previous catalog found — will run in discovery mode."

    - name: Decide refresh-catalog cadence
      id: refresh
      run: |
        # Refresh the catalog when either:
        #   (a) a workflow_dispatch run was launched with refresh_catalog=true
        #       (for ad-hoc forced refreshes mid-quarter), or
        #   (b) the scheduled run lands in a quarterly month (Jan/Apr/Jul/Oct)
        #       so newly-uncensored cells and upstream-added IDs get picked up.
        if [ "${{ github.event.inputs.refresh_catalog }}" = "true" ]; then
          echo "flag=--refresh-catalog" >> "$GITHUB_OUTPUT"
          echo "Manual --refresh-catalog requested via workflow_dispatch input."
        else
          month=$(date +%m)
          case "$month" in
            01|04|07|10)
              echo "flag=--refresh-catalog" >> "$GITHUB_OUTPUT"
              echo "Quarterly month ($month) — refreshing catalog from scratch."
              ;;
            *)
              echo "flag=" >> "$GITHUB_OUTPUT"
              echo "Non-quarterly month ($month) — using existing catalog."
              ;;
          esac
        fi

    - name: Run scrape
      env:
        # SCP's CDN throttles GitHub-hosted-runner IPs (~10-15s/request vs
        # ~0.3s from a normal host), so CI needs more workers than the
        # default 6 to fit the 6-hour job limit. See #45/#47.
        SCPS_WORKERS: "16"
      run: uv run scps-scraper scrape ${{ steps.refresh.outputs.flag }}

    - name: Tag with gh_hash
      run: echo ${{ github.sha }} > gh_hash.txt

    - name: Get current date
      id: date
      run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

    - name: Create release note
      run: |
        echo "State Cancer Profile Data\n\nScraped: ${DATE}" > release_note.txt
      env:
        DATE: ${{ steps.date.outputs.date }}

    - name: Release
      uses: softprops/action-gh-release@v2

      with:
        tag_name: ${{ steps.date.outputs.date }}
        name: release-${{ steps.date.outputs.date }}
        body_path: release_note.txt
        files: |
          gh_hash.txt
          state_cancer_profiles_incidence.csv.gz
          state_cancer_profiles_mortality.csv.gz
          state_cancer_profiles_risk.csv.gz
          state_cancer_profiles_demographics.csv.gz
          state_cancer_profiles_incidence.parquet
          state_cancer_profiles_mortality.parquet
          state_cancer_profiles_risk.parquet
          state_cancer_profiles_demographics.parquet
          select_options.json
          scrape_catalog.jsonl
          notes_incidence.txt
          notes_mortality.txt
          notes_risk.txt
          notes_demographics.txt

    - name: Manifest and Zenodo publish
      env:
        ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # Same code path as the backfill (SPEC M4). Publishes a new Zenodo
        # version only when the scrape is a new vintage; without a token it
        # still builds the manifest but records nothing (dry-run).
        if [ -n "$ZENODO_TOKEN" ]; then
          uv run python scripts/zenodo/publish_release.py \
            --release-dir . --tag "${{ steps.date.outputs.date }}"
        else
          echo "ZENODO_TOKEN not configured — manifest only, skipping Zenodo publish."
          uv run python scripts/zenodo/publish_release.py \
            --release-dir . --tag "${{ steps.date.outputs.date }}" --dry-run
        fi
        gh release upload "${{ steps.date.outputs.date }}" manifest.json --clobber

    - name: Record run in ledger
      run: |
        mkdir -p ledger
        printf '{"run":"%s","scraper_sha":"%s","workflow_run":"%s"}\n' \
          "${{ steps.date.outputs.date }}" "${{ github.sha }}" "${{ github.run_id }}" \
          >> ledger/runs.ndjson
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add ledger/runs.ndjson data/vintages.json
        if git diff --cached --quiet; then
          echo "Nothing to record."
        else
          git commit -m "Record run ${{ steps.date.outputs.date }}"
          git push
        fi
